<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Password reset</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<link rel="icon" href="static/images/forgot-password.ico"/>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" type="text/css" href="static/css/reset_pass.css">
	</head>
	<body>

		<main>
			<div class="form-main-container">
				<div class="form-wrapper">
					<div class="form-header" style="background-image: url(../static/images/header_page.jpg);">
						<span class="form-title">
							Reset your password here
						</span>
						<hr>
						<span class="form-subtitle">
							Click on "Reset" button and new password will be sent to entered email address
						</span>
					</div>

					<form class="form-content">
						<div class="input-wrapper">
							<label class="txt-style1">Your email address</label>
							<input class="input-style" type="email" name="email" id="email" autofocus required>
							<span class="input-style-focus"></span>
						</div>

						<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
							<symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
							<path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
							</symbol>
						</svg>

						<div id="error_mess" class="alert alert-danger fw-bold  w-100 d-none" role="alert" style="margin-bootom: 2px;">
							Error!
						</div>

						<button id="reset_pass_btn" class="button-style w-100">
							Reset
						</button>
					</form>
				</div>
			</div>
		</main>

		<script src="jam/js/jquery.js"></script>
		<!-- ~~~~~~~~~~~~~~ js code start ~~~~~~~~~~~~~~ -->
		<script>
		$(document).ready(function(){
			//reset pass
			$("#reset_pass_btn").on("click", function (e) {
				e.preventDefault();

				let email = $("#email").val();

				if (email) {
					submit_pass_change(email);
				}	else {
					show_alert("First enter you email address!");
				}
			});

			function submit_pass_change(email) {
				$("#reset_pass_btn").prop("disabled", "true").html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>&nbsp; Reseting...');

				var post_url = "ext/reset_pass/" + email

				$.ajax({
					url: post_url,
					type: "POST",
					contentType: "application/json;charset=utf-8",
					success: function (response) {
						console.log(response);
						if (response.error) {
							console.log(response.error);
							//server error
							show_alert(response.error);
						}

						if (response.error == null){
							//success-redirect
							show_alert("Success! Please go back to login page!");
							$("#email, #reset_pass_btn").prop("disabled", "true");
							$("#reset_pass_btn").html('Sent!');
						}
					},
					error: function (xhr, status, error) {
						//api calling error
						show_alert("Error: Please try again!");
					}
				});
			}

			function show_alert(message) {
				$("#error_mess").removeClass("d-none").html('<svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Danger:"><use xlink:href="#exclamation-triangle-fill"/></svg>' + message);
			}

			$('input').focus(function() {
				$("#error_mess").addClass("d-none");
			});
		});
		</script>
	</body>
</html>
